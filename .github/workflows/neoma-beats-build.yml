name: Build & Release Neoma Beats TWA APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'dev'
      - 'main'

jobs:
  build-neoma-beats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace --info

      - name: Prepare Signed Release APK
        run: |
          SIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found signed APK at: $SIGNED_APK"
          cp "$SIGNED_APK" neoma-beats-v2.0.0.apk
          ls -lh neoma-beats-v2.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neoma-beats-v2.0.0
          path: neoma-beats-v2.0.0.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0
          name: "Neoma Beats v2.0.0 (Official Standalone APK - 100% Web Identical)"
          body: |
            ## 🎵 Neoma Beats v2.0.0 Official Release (Web-Identical TWA)

            Aplikasi resmi Android Neoma Beats yang membawa **100% fitur website beats.neoma.space** ke perangkat Android:

            - 🎧 **Dengar Bareng (Live Vibe Session)**: Sinkronisasi real-time via P2P Supabase WebSocket.
            - 🌧️ **Ambient Soundscapes**: Suara latar Hujan, Vinyl Crackle, Api Unggun, dan Cafe Drone.
            - 🧠 **Binaural Frequencies**: Alpha 10Hz, Theta 6Hz, dan Solfeggio 432Hz.
            - ⏱️ **Zen Focus Mode**: Pomodoro Timer 25/5 dengan singing bowl chime lonceng Tibet.
            - 🎤 **Lirik Karaoke Real-Time & Spotify Connect**: Sinkronisasi playlist Spotify resmi.
            - ⚡ **Full Standalone Screen**: Tanpa address bar browser, background audio lockscreen aktif.
          files: neoma-beats-v2.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
