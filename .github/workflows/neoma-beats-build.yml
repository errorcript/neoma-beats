name: Build & Release Neoma Beats APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'dev'
      - 'main'
      - 'native-hybrid'

jobs:
  build-neoma-beats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'microsoft'
          cache: 'gradle'

      - name: Build Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify and Package APK
        run: |
          BUILD_TOOL_PATH=$(ls -d /usr/local/lib/android/sdk/build-tools/* | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOL_PATH"
          
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK: $RAW_APK"
          
          cp "$RAW_APK" neoma-beats-v2.6.0.apk
          
          echo "Verifying APK Signature..."
          $BUILD_TOOL_PATH/apksigner verify --verbose neoma-beats-v2.6.0.apk || {
            echo "Signing fallback..."
            $BUILD_TOOL_PATH/apksigner sign --ks neoma-release.jks --ks-pass pass:neoma2026 --key-pass pass:neoma2026 --ks-key-alias neomabeats neoma-beats-v2.6.0.apk
          }
          
          ls -la neoma-beats-v2.6.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neoma-beats-v2.6.0
          path: neoma-beats-v2.6.0.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/native-hybrid'
        with:
          tag_name: v2.6.0
          name: "Neoma Beats v2.6.0 (Official Native Hybrid Release)"
          body: |
            ## 🎵 Neoma Beats v2.6.0 (Official Native Hybrid Release)
            
            - **100% Web Identical UI**: Matches https://beats.neoma.space with Live Jam Sessions, Pomodoro Timer, Ambient Focus Sounds, and Synced Lyrics.
            - **Native Background Playback**: Screen off in pocket, multitasking in other apps, audio keeps playing smoothly without pausing.
            - **Offline Mode**: Download songs to local device storage for zero-buffering offline listening.
            - **Lockscreen & Notification Bar**: Real-time media controls with album artwork.
            - **Package**: `space.neoma.beats`
          files: neoma-beats-v2.6.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
